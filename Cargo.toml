[package]
name = "rusty-notes"
version = "0.1.0"
edition = "2021"
description = "A fast, keyboard-driven Markdown note editor with live preview and vault-wide search"
license = "MIT"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit", "persistence"] }
egui = "0.34"
egui_commonmark = { version = "0.23", features = ["svg"] }

walkdir = "2"
regex = "1"
aho-corasick = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
